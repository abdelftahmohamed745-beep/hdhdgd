name: Nimbus Engine — Android Dual-Flavor APKs

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'CMakeLists.txt'
      - 'engine/**'
      - 'editor/**'
      - 'android/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nimbus-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  host-regression:
    name: Verify Nimbus C++ engine & editor tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Nimbus source
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ liblua5.4-dev

      - name: Configure strict host build
        run: >-
          cmake -S . -B build-host -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DNIMBUS_WARNINGS_AS_ERRORS=ON
          -DNIMBUS_ENABLE_LUA=ON
          -DNIMBUS_ENABLE_VULKAN=OFF
          -DNIMBUS_ENABLE_GLES=OFF
          -DNIMBUS_BUILD_EDITOR=ON
          -DNIMBUS_BUILD_TESTS=ON

      - name: Compile host engine and integration tests
        run: cmake --build build-host --parallel 2

      - name: Run CTest
        run: ctest --test-dir build-host --output-on-failure

      - name: Run full Nimbus test report
        run: ./build-host/nimbus_tests

  android-apk:
    name: Build and verify Runtime & Editor Android APKs (arm64-v8a)
    needs: host-regression
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Nimbus source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.2.12479018' \
            'cmake;3.22.1'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Nimbus Runtime & Editor Android APKs
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleRuntimeDebug :app:assembleEditorDebug

      - name: Verify packages, ABI, alignment and signatures
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          RUNTIME_APK='android/app/build/outputs/apk/runtime/debug/app-runtime-debug.apk'
          EDITOR_APK='android/app/build/outputs/apk/editor/debug/app-editor-debug.apk'
          test -s "$RUNTIME_APK"
          test -s "$EDITOR_APK"

          "$AAPT" dump badging "$RUNTIME_APK" | grep -q "package: name='com.nimbus.engine'"
          "$AAPT" dump badging "$EDITOR_APK" | grep -q "package: name='com.nimbus.editor'"
          "$ZIPALIGN" -c -v 4 "$RUNTIME_APK"
          "$ZIPALIGN" -c -v 4 "$EDITOR_APK"
          "$APKSIGNER" verify --verbose "$RUNTIME_APK"
          "$APKSIGNER" verify --verbose "$EDITOR_APK"

          mkdir -p dist
          cp "$RUNTIME_APK" dist/NimbusEngine-Runtime-arm64-v8a-debug.apk
          cp "$EDITOR_APK" dist/NimbusStudio-Editor-arm64-v8a-debug.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload installable APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NimbusEngine-Android-arm64-v8a-APKs
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
